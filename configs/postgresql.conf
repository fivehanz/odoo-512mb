### Managed by odoo-512mb repo (symlinked to /etc/postgresql/17/main/postgresql.conf).
### Debian-required location settings (same values pg_createcluster generates).
### For Debian 13 / PostgreSQL 17 only -- the deploy script refuses mismatches.

data_directory = '/var/lib/postgresql/17/main'
hba_file = '/etc/postgresql/17/main/pg_hba.conf'
ident_file = '/etc/postgresql/17/main/pg_ident.conf'
external_pid_file = '/var/run/postgresql/17-main.pid'
port = 5432
unix_socket_directories = '/var/run/postgresql'
ssl = on
ssl_cert_file = '/etc/ssl/certs/ssl-cert-snakeoil.pem'
ssl_key_file = '/etc/ssl/private/ssl-cert-snakeoil.key'

# --- 512 MB profile: conservative, predictability over throughput ---
shared_buffers = 64MB
effective_cache_size = 128MB
work_mem = 1MB
maintenance_work_mem = 16MB
autovacuum_work_mem = 8MB
temp_buffers = 1MB

max_connections = 20
max_worker_processes = 2
max_parallel_workers = 0
max_parallel_workers_per_gather = 0

wal_buffers = 2MB
min_wal_size = 32MB
max_wal_size = 128MB
checkpoint_completion_target = 0.9

huge_pages = off
effective_io_concurrency = 1
random_page_cost = 1.1

autovacuum_max_workers = 1
autovacuum_naptime = 60s