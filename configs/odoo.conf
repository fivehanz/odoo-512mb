[options]

### Managed by odoo-512mb repo (symlinked to /etc/odoo/odoo.conf).
### Edit here and re-run: sudo ./deploy.sh

# --- paths ---
addons_path = /opt/odoo/odoo/addons
data_dir = /var/lib/odoo

# --- database: unix socket + peer auth as OS user 'odoo', no password ---
db_host = False
db_port = False
db_user = odoo
db_password = False
db_name = odoo
list_db = False

# --- HTTP (nginx terminates TLS in front, see configs/nginx-odoo.conf) ---
http_interface = 127.0.0.1
http_port = 8069
proxy_mode = True

# --- 512 MB profile: one threaded process, one cron thread ---
# (limit_time_cpu/real are accepted in threaded mode but only enforced
#  under multiprocessing workers; kept for parity with the reference config)
workers = 0
max_cron_threads = 1
limit_request = 4096
limit_time_cpu = 60
limit_time_real = 120

# --- logging ---
log_level = warn

# --- admin master password for the web database manager; deploy.sh replaces
#     the placeholder below with a random value on first deploy ---
admin_passwd = __GENERATE__