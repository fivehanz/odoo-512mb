[options]

### Managed by odoo-512mb repo (rendered into /etc/odoo/odoo.conf by deploy.sh).
### Edit here and re-run: sudo ./deploy.sh

# --- paths ---
addons_path = /opt/odoo/odoo/addons
data_dir = /var/lib/odoo

# --- database: unix socket + peer auth as OS user 'odoo', no password ---
# db_name below is the single owner of the database name: deploy.sh and
# scripts/backup.sh both read it from here instead of repeating the literal.
db_user = odoo
db_name = odoo
list_db = False

# --- HTTP (nginx terminates TLS in front, see configs/nginx-odoo.conf) ---
http_interface = 127.0.0.1
http_port = 8069
proxy_mode = True

# --- 512 MB profile: one threaded process, one cron thread ---
# (limit_time_cpu/real are accepted in threaded mode but only enforced
#  under multiprocessing workers; kept for parity with the reference config)
workers = 0
max_cron_threads = 1
limit_request = 4096
limit_time_cpu = 60
limit_time_real = 120

# --- logging ---
log_level = warn

# --- admin master password for the web database manager. The placeholder stays
#     in the repo forever: deploy.sh renders this file into /etc/odoo/odoo.conf
#     (a real file, root:odoo 640) with a random value, so no secret is ever
#     written into git and the tree stays clean for `git pull`. ---
admin_passwd = __GENERATE__