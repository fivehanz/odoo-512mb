# Managed by odoo-512mb repo (symlinked to /etc/nginx/sites-available/odoo.conf
# and sites-enabled/odoo.conf). Edit here and run: sudo nginx -s reload

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream odoo {
  server 127.0.0.1:8069;
}

# Disk-backed cache -- keys live in 4m RAM, objects live on disk.
proxy_cache_path /var/cache/nginx/odoo levels=1:2 keys_zone=odoo_cache:4m max_size=128m inactive=7d use_temp_path=off;
proxy_cache_key "$host$request_uri";
proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# HTTP -> HTTPS, plus ACME webroot so `certbot certonly --webroot` can run
# without touching this file (see README, "Real domain / Let's Encrypt").
server {
  listen 80;
  server_name _;
  location /.well-known/acme-challenge/ { root /var/www/html; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/ssl/odoo.crt;
  ssl_certificate_key /etc/nginx/ssl/odoo.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  gzip on;
  gzip_comp_level 4;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/xml+rss image/svg+xml;

  client_max_body_size 100m;

  # Hashed/immutable assets: nginx disk cache + long browser cache.
  location ~ /web/assets/ {
    proxy_pass http://odoo;
    proxy_cache odoo_cache;
    proxy_cache_valid 200 30d;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }

  # Unhashed static framework files: same treatment, shorter TTL.
  location ~ /web/static/ {
    proxy_pass http://odoo;
    proxy_cache odoo_cache;
    proxy_cache_valid 200 7d;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=604800";
  }

  # Record images/attachments: contents change, keep to one day.
  location ~ /web/image/ {
    proxy_pass http://odoo;
    proxy_cache odoo_cache;
    proxy_cache_valid 200 1d;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=86400";
  }

  # WebSocket (bus/presence/live updates).
  location /websocket {
    proxy_pass http://odoo;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
  }

  # Everything else is user/session-specific: pass through, never cached.
  location / {
    proxy_pass http://odoo;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 120s;
  }
}