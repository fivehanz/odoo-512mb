# Managed by odoo-512mb repo (symlinked to /etc/postgresql/17/main/pg_hba.conf).
# Pinned here so the auth model the deploy depends on cannot drift under a
# package upgrade: peer auth on the Unix socket, nothing over TCP.
#
# Odoo runs as OS user 'odoo' and connects over the socket, so it maps to the
# database role 'odoo' and no password exists anywhere. Odoo and PostgreSQL both
# bind to loopback, and TCP connections are rejected rather than password-
# checked, so there is no credential surface to leak or brute-force.
#
# Standalone server: replication entries are deliberately omitted.

# Debian admin path (root's `sudo -u postgres psql`, pg_ctlcluster, dumps).
local   all             postgres                                peer
# Application path: OS user name == role name.
local   all             all                                     peer
# No TCP: nginx and Odoo talk to PostgreSQL over the socket only.
host    all             all             127.0.0.1/32            reject
host    all             all             ::1/128                 reject
