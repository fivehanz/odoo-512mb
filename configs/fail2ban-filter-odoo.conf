# Managed by odoo-512mb repo (symlinked to /etc/fail2ban/filter.d/odoo-login.conf).
# Matches failed Odoo form logins in the nginx access log (combined format).
# Success is a 302 redirect; a failure re-renders the login page as 200 (422 on
# some Odoo 19 form errors), so a 200/422 POST to /web/login is a failed login.

[Definition]
failregex = ^<HOST> .*"POST /web/login HTTP/[12]\.[01]" (200|422)
ignoreregex =